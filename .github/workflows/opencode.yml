name: OpenCode

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  opencode-layer:
    name: OpenCode layer
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python 3.11
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.11"

      - name: Install test dependencies
        run: pip install requests pytest

      - name: Check generated layer is in sync
        run: python3 scripts/opencode_sync.py --check

      - name: Compile new Python scripts
        run: |
          python3 -m py_compile \
            scripts/opencode_sync.py \
            scripts/opencode_extensions.py \
            scripts/opencode_models.py

      - name: Run OpenCode tests
        run: pytest tests/test_opencode_*.py -q

  fedora-smoke:
    name: Fedora smoke
    runs-on: ubuntu-latest
    container: fedora:latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install Python and test dependencies
        run: |
          dnf install -y python3 python3-pip python3-devel
          python3 -m venv /tmp/venv
          /tmp/venv/bin/pip install --quiet pytest requests

      - name: Check generated layer
        run: python3 scripts/opencode_sync.py --check

      - name: Run OpenCode tests
        run: /tmp/venv/bin/python -m pytest tests/test_opencode_*.py -q

      - name: Check launcher help
        run: bash scripts/seo doctor --help
